<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÂN TENNIS VIỆT QUỐC - Đăng Ký</title>
    <link rel="stylesheet" href="LoginFrame.css" />
  </head>
  <body>
    <div class="login-box">
      <h2>Đăng ký tài khoản</h2>
      <form id="registerForm">
        <!-- Thông tin tài khoản -->
        <label for="username">Tên đăng nhập: </label>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên đăng nhập"
          required
        />

        <label for="password">Mật khẩu: </label>
        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu"
          required
        />

        <label for="cccd">Số CCCD: </label>
        <input
          type="text"
          id="cccd"
          placeholder="Nhập số căn cước công dân"
          required
        />

        <hr style="border: 0.5px solid #ccc; margin: 15px 0" />

        <!-- Thông tin cá nhân (Dành cho hồ sơ khách hàng) -->
        <label for="fullname">Họ tên: </label>
        <input
          type="text"
          id="fullname"
          placeholder="Nhập họ và tên"
          required
        />

        <label for="phone">Số điện thoại: </label>
        <input
          type="tel"
          id="phone"
          placeholder="Nhập số điện thoại"
          required
        />

        <label for="email">Email: </label>
        <input
          type="email"
          id="email"
          placeholder="Nhập địa chỉ email"
          required
        />

        <label for="birthdate">Ngày sinh: </label>
        <input type="date" id="birthdate" required />

        <label for="address">Địa chỉ: </label>
        <input
          type="text"
          id="address"
          placeholder="Nhập địa chỉ của bạn"
          required
        />

        <button type="submit">Đăng ký</button>

        <div class="register-group">
          <p>Đã có tài khoản? <a href="LoginFrame.html">Đăng nhập ngay</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
