<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÂN TENNIS VIỆT QUỐC - Đăng Nhập</title>
    <link rel="stylesheet" href="LoginFrame.css" />
  </head>
  <body>
    <div class="login-box">
      <h2>Đăng nhập:</h2>
      <form id="loginForm">
        <label for="username">Email/Tên đăng nhập: </label>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên đăng nhập"
          required
        />

        <label for="password">Mật khẩu: </label>
        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu"
          required
        />

        <div class="options-group">
          <div class="remember-group">
            <input type="checkbox" id="remember-me" name="remember" />
            <label for="remember-me">Ghi nhớ mật khẩu</label>
          </div>
          <!-- Cập nhật link sang trang Quên mật khẩu -->
          <a href="ForgotPassword.html" class="forgot-password"
            >Quên mật khẩu?</a
          >
        </div>

        <button type="submit">Đăng nhập</button>

        <div class="register-group">
          <!-- Cập nhật link sang trang Đăng ký -->
          <p>Chưa có tài khoản? <a href="Register.html">Đăng ký</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
