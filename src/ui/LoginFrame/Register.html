<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÂN TENNIS VIỆT QUỐC - Đăng Ký</title>
    <link rel="stylesheet" href="LoginFrame.css" />
    <style>
      .error-msg {
        color: #ff3333;
        font-size: 13px;
        display: block;
        margin-top: 3px;
        margin-bottom: 8px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Đăng ký tài khoản</h2>
      <form id="registerForm" novalidate>
        <!-- Thông tin tài khoản -->
        <label for="username">Tên đăng nhập: </label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" />
        <small id="usernameError" class="error-msg"></small>

        <label for="password">Mật khẩu: </label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" />
        <small id="passwordError" class="error-msg"></small>

        <label for="confirmPassword">Xác nhận mật khẩu: </label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Nhập lại mật khẩu"
        />
        <small id="confirmPasswordError" class="error-msg"></small>

        <label for="cccd">Số CCCD: </label>
        <input type="text" id="cccd" placeholder="Nhập số căn cước công dân" />
        <small id="cccdError" class="error-msg"></small>

        <hr style="border: 0.5px solid #ccc; margin: 15px 0" />

        <!-- Thông tin cá nhân -->
        <label for="fullname">Họ tên: </label>
        <input type="text" id="fullname" placeholder="Nhập họ và tên" />
        <small id="fullnameError" class="error-msg"></small>

        <label for="phone">Số điện thoại: </label>
        <input type="tel" id="phone" placeholder="Nhập số điện thoại" />
        <small id="phoneError" class="error-msg"></small>

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="Nhập địa chỉ email" />
        <small id="emailError" class="error-msg"></small>

        <label for="birthdate">Ngày sinh: </label>
        <input type="date" id="birthdate" />
        <small id="birthdateError" class="error-msg"></small>

        <label for="address">Địa chỉ: </label>
        <input type="text" id="address" placeholder="Nhập địa chỉ của bạn" />
        <small id="addressError" class="error-msg"></small>

        <button type="submit">Đăng ký</button>

        <div class="register-group">
          <p>Đã có tài khoản? <a href="LoginFrame.html">Đăng nhập ngay</a></p>
        </div>
      </form>
    </div>
    <script src="register.js"></script>
  </body>
</html>
