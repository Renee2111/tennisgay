<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÂN TENNIS VIỆT QUỐC - Quên Mật Khẩu</title>
    <link rel="stylesheet" href="LoginFrame.css" />
  </head>
  <body>
    <div class="login-box">
      <h2>Quên mật khẩu</h2>
      <form id="forgotPasswordForm">
        <label for="username">Email/Tên đăng nhập: </label>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên đăng nhập"
          required
        />

        <label for="cccd">Số CCCD (Xác minh): </label>
        <input
          type="text"
          id="cccd"
          placeholder="Nhập số căn cước công dân"
          required
        />

        <label for="newPassword">Mật khẩu mới: </label>
        <input
          type="password"
          id="newPassword"
          placeholder="Nhập mật khẩu mới"
          required
        />

        <button type="submit">Xác nhận đổi mật khẩu</button>

        <div class="register-group">
          <p><a href="LoginFrame.html">Quay lại Đăng nhập</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
