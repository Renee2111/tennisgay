<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tổng quan - Admin Dashboard</title>
    <link rel="stylesheet" href="AdMinUI.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="admin-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <i class="fa-solid fa-building"></i>
          <span>CôngTy UI</span>
        </div>
        <ul class="sidebar-menu">
          <li class="active">
            <a href="Dashboard.html"
              ><i class="fa-solid fa-chart-pie"></i> Tổng quan</a
            >
          </li>
          <li>
            <a href="AdMinUI.html"
              ><i class="fa-solid fa-users"></i> Quản lý nhân viên</a
            >
          </li>
          <li>
            <a href="Attendance.html"
              ><i class="fa-solid fa-calendar-check"></i> Chấm công</a
            >
          </li>
          <li>
            <a href="Payroll.html"
              ><i class="fa-solid fa-file-invoice-dollar"></i> Lương thưởng</a
            >
          </li>
          <li>
            <a href="Settings.html"><i class="fa-solid fa-gear"></i> Cài đặt</a>
          </li>
        </ul>
      </aside>

      <main class="main-content">
        <!-- HEADER -->
        <header class="top-header">
          <div class="header-left">
            <h2>Tổng quan hệ thống</h2>
          </div>
          <div class="header-right">
            <div class="user-profile">
              <img src="" alt="" style="background-color: #e2e8f0" />
              <span id="headerAdminName"></span>
              <!-- Đợi backend -->
            </div>
          </div>
        </header>

        <section class="content-area">
          <div class="card">
            <div class="card-header">
              <h3>Biểu đồ & Thống kê</h3>
            </div>
            <div class="card-body" id="dashboardData">
              <!-- Khu vực để trắng, chờ load data chart/thống kê từ Backend -->
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
